<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant todo list application to manage your daily tasks">
    <title>Todo List App - Manage Your Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" role="main">
        <div class="header">
            <h1>My Todo List</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">&#x1F319;</button>
        </div>
        <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Task completion">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <form class="input-section" onsubmit="return false;" aria-label="Add new task">
            <label for="todoInput" class="sr-only">New task</label>
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                aria-label="New task input"
                maxlength="200"
                autocomplete="off"
            >
            <button id="addBtn" type="submit" aria-label="Add task">Add</button>
        </form>
        <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="stats">
            <span class="todo-count" aria-live="polite"></span>
            <button class="clear-completed" id="clearCompleted">Clear Completed</button>
        </div>
        <ul id="todoList" role="list" aria-label="Tasks list"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
